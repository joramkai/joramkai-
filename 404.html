<script>
(function(){
  var v=document.getElementById('heroVid');
  if(v){v.muted=true;v.defaultMuted=true;v.playsInline=true;var go=function(){var p=v.play();if(p&&p.catch)p.catch(function(){});};
    if(v.readyState>=2)go();else v.addEventListener('canplay',go,{once:true});}
  var el=document.getElementById('typed'),words=['hardware','PCB enclosures','wearables','car parts','electronics','cosmetic products'],w=0,n=0,del=false;
  function step(){var word=words[w],wait;
    if(!del){n++;wait=n>=word.length?(del=true,1700):85;}
    else{n--;if(n<=0){n=0;del=false;w=(w+1)%words.length;wait=350;}else wait=40;}
    el.textContent=word.slice(0,n);setTimeout(step,wait);}
  setTimeout(step,400);
})();
</script>
